<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTasks</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>CloudTasks</h1>
    <p>Gestión de tareas en la nube</p>
  </header>

  <main class="container">
    <section class="task-form-section">
      <form id="task-form">
        <input type="text" id="title" placeholder="Título de la tarea" required maxlength="80">
        <textarea id="description" placeholder="Descripción" maxlength="300"></textarea>

        <div class="form-row">
          <label for="deadline">Fecha límite</label>
          <input type="date" id="deadline">

          <label for="priority">Prioridad</label>
          <select id="priority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
          </select>
        </div>

        <button type="submit">Agregar tarea</button>
        <p id="form-error" class="error"></p>
      </form>
    </section>

    <section class="task-list-section">
      <div class="filters">
        <button data-filter="all" class="filter-btn active">Todas</button>
        <button data-filter="pending" class="filter-btn">Pendientes</button>
        <button data-filter="completed" class="filter-btn">Completadas</button>
      </div>
      <ul id="task-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</body>
</html>
